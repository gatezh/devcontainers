# Change "myproject" to your project name — must be unique across projects
name: myproject
services:
  devcontainer:
    # Image freshness is handled by the host-side `initializeCommand` pull in
    # devcontainer.json (keep the image reference in sync). Do NOT add
    # `pull_policy: always` here — on Linux/WSL2 `updateRemoteUserUID` builds a
    # local-only image and Compose would then try to pull it, breaking the
    # container launch with "pull access denied" (see issue #109).
    image: ghcr.io/gatezh/devcontainers/claude-code:latest
    volumes:
      - ..:/workspace:cached
      # Bun's package cache and global store, shared by every project's default variant
      # (README "Shared Bun store"). Declared here because Compose prefixes devcontainer.json
      # `mounts` with the project name; only a fixed `name:` is shared across projects.
      - bun-global-store:/home/node/.bun/install/cache

volumes:
  bun-global-store:
    name: bun-global-store
