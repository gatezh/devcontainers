name: Build claude-code

on:
  push:
    branches: [master]
    # Everything in the build context except the project templates, so a new
    # COPY'd file can't be missed (#175, #205). A template edit costs one extra build.
    paths:
      - "claude-code/.devcontainer/**"
      - "!claude-code/.devcontainer/devcontainer.json"
      - "!claude-code/.devcontainer/docker-compose.yml"
      - "!claude-code/.devcontainer/init-plugins.sh"
      - "!claude-code/.devcontainer/claude-sandbox/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-claude-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-default:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      target: default
      context: claude-code/.devcontainer
      # Reuse unchanged layers so a Claude Code bump republishes only its own layer.
      cache: true
      cache-scope: claude-code

      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/gatezh/devcontainers/claude-code
      meta-tags: |
        type=raw,value=latest
        type=sha,prefix=
        type=raw,value={{date 'YYYYMMDD'}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-sandbox:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      target: sandbox
      context: claude-code/.devcontainer
      cache: true
      cache-scope: claude-code-sandbox

      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/gatezh/devcontainers/claude-code-sandbox
      meta-tags: |
        type=raw,value=latest
        type=sha,prefix=
        type=raw,value={{date 'YYYYMMDD'}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Verify ${{ matrix.image-suffix }} (${{ matrix.arch }})
    needs: [build-default, build-sandbox]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-suffix: claude-code
            target: default
            runner: ubuntu-24.04
            arch: amd64
          - image-suffix: claude-code
            target: default
            runner: ubuntu-24.04-arm
            arch: arm64
          - image-suffix: claude-code-sandbox
            target: sandbox
            runner: ubuntu-24.04
            arch: amd64
          - image-suffix: claude-code-sandbox
            target: sandbox
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image
        env:
          IMAGE: ghcr.io/gatezh/devcontainers/${{ matrix.image-suffix }}:latest
          TARGET: ${{ matrix.target }}
        run: |
          docker pull "$IMAGE"
          # NET_ADMIN/NET_RAW let the sandbox check bring up its firewall.
          docker run --rm --cap-add NET_ADMIN --cap-add NET_RAW \
            -v "$PWD/claude-code/verify-image.sh:/verify-image.sh:ro" "$IMAGE" bash /verify-image.sh "$TARGET"
